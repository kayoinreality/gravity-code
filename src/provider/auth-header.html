<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="auth-header.css">
<title>Conectar Gemini</title>
</head>
<body>
<div class="brand">
  <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
    <defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#4285F4"/><stop offset=".38" stop-color="#34A853"/><stop offset=".68" stop-color="#FBBC05"/><stop offset="1" stop-color="#EA4335"/></linearGradient></defs>
    <path d="M5 27 C9 15 12 7 16 7 C20 7 23 15 27 27" fill="none" stroke="url(#g)" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M10.5 20.5 H21.5" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" opacity=".85"/>
    <circle cx="16" cy="3.6" r="2.2" fill="#ececf1"/>
  </svg>
  <div class="text">
    <strong>Conectar conta Google</strong>
    <span id="status">Entre na sua conta Google para conectar o Gemini.</span>
  </div>
</div>
<div class="controls">
  <span id="origin">accounts.google.com</span>
  <button id="back" type="button">Voltar ao Gravity</button>
</div>
<script src="auth-header.js"></script>
</body>
</html>
